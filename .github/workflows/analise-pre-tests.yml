name: Análise Pré isolated tests

on:
  push:
    branches:
      - feature/analise-pre-isolada
    paths:
      - 'analise-pre/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/analise-pre-tests.yml'
  pull_request:
    paths:
      - 'analise-pre/**'
      - 'package.json'
      - '.github/workflows/analise-pre-tests.yml'

jobs:
  test-parser-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check server syntax
        run: node --check server.js
      - name: Run isolated tests
        run: node --test analise-pre/*.test.js
