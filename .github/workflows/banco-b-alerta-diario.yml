name: Banco B - Alerta diário Análise Pré

on:
  push:
    branches:
      - feature/alerta-diario-analise-pre
    paths:
      - 'scripts/**'
      - '.github/workflows/banco-b-alerta-diario.yml'
  schedule:
    - cron: "0 5 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Testar consulta e relatório sem enviar e-mail"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes unitários
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Gerar e enviar relatório
        if: github.event_name != 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python scripts/banco_b_daily_report.py
