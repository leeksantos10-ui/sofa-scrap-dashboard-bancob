name: Championship helper tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/championship-config]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
